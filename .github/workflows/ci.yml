name: pne-scheduler-ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  dependency-lock-candidate:
    # Manual, read-only maintenance: produce a reviewed lockfile artifact.
    # No write token, automatic commit, or default-branch dependency mutation.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve patched maintenance version
        run: |
          npm view postcss@8.5.23 version engines --json
          npm view sharp@0.35.4 version engines --json
          npm pkg set overrides.postcss=8.5.23 overrides.sharp=0.35.4
          npm install --package-lock-only --ignore-scripts --save-exact next@15.5.25
      - name: Audit candidate
        run: npm audit --audit-level=high --json > npm-audit-candidate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-lock-candidate
          path: |
            web/package.json
            web/package-lock.json
            web/npm-audit-candidate.json
          retention-days: 7

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        shell: bash
        run: |
          python -m pip install -U pip
          if [ "${{ matrix.python }}" = "3.14" ]; then
            python -m pip install -c constraints/py314.txt -e ".[dev,web]"
          else
            python -m pip install -e ".[dev,web]"
          fi
      - name: Record resolved dependencies
        run: python -m pip freeze > resolved-dependencies.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: python -m pytest tests/ -q --tb=short -rs --junitxml=test-results.xml
      - name: Assert Flask is installed (the API tests must not skip)
        run: python -c "import flask; from importlib.metadata import version; print('flask', version('flask'))"
      - name: Corpus report smoke (in-repo zips)
        run: python tools/compare_pne_units.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-${{ matrix.os }}-${{ matrix.python }}
          path: |
            test-results.xml
            resolved-dependencies.txt
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Record npm security audit (nonblocking)
        continue-on-error: true
        run: npm audit --json > npm-audit.json
      - name: Controller tests (not DOM tests)
        run: npm test 2>&1 | tee frontend-tests.txt
      - run: npm run build
      - run: npx --no-install tsc --noEmit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Browser and Flask proxy smoke
        run: |
          python -m pip install -c ../constraints/py314.txt -e "..[web]"
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx --no-install playwright install --with-deps chromium
          npx --no-install playwright test --config=playwright.config.mjs
      - name: Record resolved dependencies
        if: always()
        run: npm ls --all > resolved-node-dependencies.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-node22
          path: |
            web/frontend-tests.txt
            web/resolved-node-dependencies.txt
            web/npm-audit.json
            web/test-results/
          retention-days: 14
